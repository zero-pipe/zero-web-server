name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量提供可复现信息。安全漏洞请勿在此提交，见 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      placeholder: e.g. 1.0.0 / 1a2b3c4
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 问题描述
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
        3. 期望结果 / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      render: shell
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: OS / Go / MySQL / Redis / ZMS 版本
    validations:
      required: false
