name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景 / 使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 影响范围
    validations:
      required: false
