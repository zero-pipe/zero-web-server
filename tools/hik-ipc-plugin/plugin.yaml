# 示例插件清单（规范 v1，详见 docs/PLUGIN_PLATFORM.md）
spec: 1
id: hik-ipc
name: 海康 IPC
vendor: hikvision
version: 0.4.0
protocols: [hik.private.v5]
rpc: v1
executable:
  windows-amd64: hik-ipc-plugin.exe
  linux-amd64: hik-ipc-plugin
listen: 127.0.0.1:19091
health: /health
# 只声明已实现的接口，避免平台点亮一个点下去不响应的按钮。
# playback 走海康按时间回放的 RTSP 地址，由 ZMS 拉流；
# 暂停/倍速/拖放没有控制通道，/v1/playback/control 会明确回 UNSUPPORTED。
capabilities: [login, channels, live, ptz, snapshot, arm, disarm, playback, record_query]
stream_transports: [rtp_push, rtsp_url]
event_types: [motion, line_crossing, intrusion, video_loss, tamper]
config_schema: schema.json
env:
  LD_LIBRARY_PATH: ${PLUGIN_DIR}/lib
