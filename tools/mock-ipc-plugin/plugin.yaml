# 示例插件清单（规范 v1，详见 docs/PLUGIN_PLATFORM.md）
spec: 1
id: mock-ipc
name: Mock IPC
vendor: mock
version: 0.2.0
protocols: [mock.ipc.v1]
rpc: v1
executable:
  windows-amd64: mock-ipc-plugin.exe
  linux-amd64: mock-ipc-plugin
  darwin-arm64: mock-ipc-plugin
listen: 127.0.0.1:19090
health: /health
capabilities: [login, logout, channels, live, ptz, snapshot, arm, disarm, playback, record_query, config]
# 自定义能力：平台不解释语义，通过通用 command 透传给驱动（见 docs/设备能力与自定义扩展.md）
custom_capabilities:
  - id: face.push
    title: 下发人脸
    params_schema: '{"type":"object","properties":{"imageUrl":{"type":"string"},"personId":{"type":"string"}},"required":["imageUrl"]}'
    result_schema: '{"type":"object","properties":{"accepted":{"type":"boolean"}}}'
  - id: door.open
    title: 远程开门
stream_transports: [rtsp_url, rtp_push]
event_types: [motion, line_crossing, intrusion, video_loss, tamper]
config_schema: schema.json
