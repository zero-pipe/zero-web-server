<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeroo 设备/视频接入管理 - 字体排版设计优化演示</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind Config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom Dynamic Font Control System -->
  <style id="dynamic-typography-styles">
    /* 预设方案 A：现代清爽型 (默认) */
    :root {
      --ui-font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --code-font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --numeric-feature: tabular-nums;
      --table-header-weight: 600;
      --table-data-size: 13px;
      --header-bg-color: #f9fafb;
    }

    /* 渲染应用规则 */
    body {
      font-family: var(--ui-font-family);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-code {
      font-family: var(--code-font-family);
    }

    .font-tabular {
      font-variant-numeric: var(--numeric-feature);
    }

    .table-header-custom {
      font-weight: var(--table-header-weight);
    }

    .table-data-custom {
      font-size: var(--table-data-size);
    }

    /* 提示高亮样式（用于分析） */
    .highlight-mode .font-code {
      outline: 1.5px dashed #8b5cf6 !important;
      background-color: rgba(139, 92, 246, 0.08) !important;
      position: relative;
    }
    .highlight-mode .font-code::after {
      content: 'Mono';
      position: absolute;
      top: -8px;
      right: -4px;
      font-size: 9px;
      background: #8b5cf6;
      color: white;
      padding: 0 3px;
      border-radius: 2px;
      font-family: sans-serif;
      pointer-events: none;
    }

    .highlight-mode .font-tabular:not(.font-code) {
      outline: 1.5px dashed #10b981 !important;
      background-color: rgba(16, 185, 129, 0.08) !important;
    }

    /* 自定义滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>

        <div class="px-3 py-2 text-gray-400 font-semibold text-[11px]">接入控制</div>
        
        <a href="#" class="flex items-center px-3 py-2 rounded-md bg-blue-50 text-blue-600 font-medium">

        <a href="#" class="flex items-center px-3 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition-colors">

    // 搜索过滤逻辑
    function filterData() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      const modeVal = document.getElementById('modeSelect').value;
      const protocolVal = document.getElementById('protocolSelect').value;
      const statusVal = document.getElementById('statusSelect').value;

      const filtered = mockDevices.filter(item => {
        const matchesSearch = !searchVal || 
          item.name.toLowerCase().includes(searchVal) || 
          item.ip.toLowerCase().includes(searchVal) ||
          item.address.toLowerCase().includes(searchVal);

        const matchesMode = modeVal === 'all' || item.modeType === modeVal;
        const matchesProtocol = protocolVal === 'all' || item.protocol === protocolVal;
        const matchesStatus = statusVal === 'all' || item.statusType === statusVal;

        return matchesSearch && matchesMode && matchesProtocol && matchesStatus;
      });

      renderTable(filtered);
    }

    // 绑定事件监听
    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('modeSelect').addEventListener('change', filterData);
    document.getElementById('protocolSelect').addEventListener('change', filterData);
    document.getElementById('statusSelect').addEventListener('change', filterData);

    // 浮动控制面板逻辑
    let isPanelOpen = true;
    function toggleInspector() {
      const content = document.getElementById('inspectorContent');
      const chevron = document.getElementById('chevronIcon');
      isPanelOpen = !isPanelOpen;
      
      if (isPanelOpen) {
        content.classList.remove('hidden');
        chevron.classList.remove('rotate-180');
      } else {
        content.classList.add('hidden');
        chevron.classList.add('rotate-180');
      }
    }

    // 预设应用
    function applyPreset(preset) {
      const root = document.documentElement;
      const toggleMono = document.getElementById('toggleMono');
      const toggleTabular = document.getElementById('toggleTabular');
      const fontSizeSelect = document.getElementById('fontSizeSelect');
      const headerWeightSelect = document.getElementById('headerWeightSelect');

      // 重置按钮边框样式
      ['A', 'B', 'C'].forEach(p => {
        const btn = document.getElementById(`btnPreset${p}`);
        btn.className = `flex flex-col items-start p-2 border ${p === preset ? 'border-2 border-blue-500 bg-blue-50/50' : 'border-gray-200 hover:border-gray-300'} rounded-lg text-left transition-all`;
      });

      const tag = document.getElementById('panelStatusTag');
      tag.innerText = `方案 ${preset}`;

      if (preset === 'A') {
        // 现代清爽型 (Inter + 系统黑体, tabular-nums 开启, monospace 仅辅助)
        root.style.setProperty('--ui-font-family', "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif");
        root.style.setProperty('--code-font-family', "'Inter', sans-serif");
        root.style.setProperty('--numeric-feature', 'tabular-nums');
        root.style.setProperty('--table-header-weight', '600');
        root.style.setProperty('--table-data-size', '13px');

        toggleMono.checked = false;
        toggleTabular.checked = true;
        fontSizeSelect.value = '13px';
        headerWeightSelect.value = '600';
      } 
      else if (preset === 'B') {
        // 硬核工程监控风 (Inter + JetBrains Mono)
        root.style.setProperty('--ui-font-family', "'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei UI', sans-serif");
        root.style.setProperty('--code-font-family', "'JetBrains Mono', monospace");
        root.style.setProperty('--numeric-feature', 'tabular-nums');
        root.style.setProperty('--table-header-weight', '600');
        root.style.setProperty('--table-data-size', '13px');

        toggleMono.checked = true;
        toggleTabular.checked = true;
        fontSizeSelect.value = '13px';
        headerWeightSelect.value = '600';
      } 
      else if (preset === 'C') {
        // 传统无优化方案 (系统默认，无 tabular-nums)
        root.style.setProperty('--ui-font-family', "'Microsoft YaHei', SimSun, sans-serif");
        root.style.setProperty('--code-font-family', "'Microsoft YaHei', SimSun, sans-serif");
        root.style.setProperty('--numeric-feature', 'normal');
        root.style.setProperty('--table-header-weight', '400');
        root.style.setProperty('--table-data-size', '13px');

        toggleMono.checked = false;
        toggleTabular.checked = false;
        fontSizeSelect.value = '13px';
        headerWeightSelect.value = '400';
      }
    }

    // 自定义微调更新
    function updateCustomSettings() {
      const root = document.documentElement;
      const useMono = document.getElementById('toggleMono').checked;
      const useTabular = document.getElementById('toggleTabular').checked;
      const fontSize = document.getElementById('fontSizeSelect').value;
      const headerWeight = document.getElementById('headerWeightSelect').value;

      root.style.setProperty('--code-font-family', useMono ? "'JetBrains Mono', monospace" : "'Inter', sans-serif");
      root.style.setProperty('--numeric-feature', useTabular ? 'tabular-nums' : 'normal');
      root.style.setProperty('--table-data-size', fontSize);
      root.style.setProperty('--table-header-weight', headerWeight);
    }

    // 切换视觉作用域标注模式
    function toggleHighlightMode() {
      isHighlightMode = !isHighlightMode;
      const btnText = document.getElementById('highlightText');
      if (isHighlightMode) {
        document.body.classList.add('highlight-mode');
        btnText.innerText = '关闭“字体生效区域”高亮标注';
      } else {
        document.body.classList.remove('highlight-mode');
        btnText.innerText = '开启“字体生效区域”高亮标注';
      }
    }

    // Toast 浮动提示框 (代替 alert)
    function triggerToast(message) {
      const existing = document.getElementById('custom-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'custom-toast';
      toast.className = 'fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-4 py-2 rounded-lg shadow-xl text-xs font-medium z-50 flex items-center space-x-2 transition-all animate-bounce';
      toast.innerHTML = `
        <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>${message}</span>
      `;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 2500);
    }

    // 添加设备测试逻辑
    function addNewDevice() {
      const newId = String(mockDevices.length + 1);
      const newDev = {
        id: newId,
        name: `camera-new-node-0${newId}`,
        mode: "主动",
        modeType: "active",
        protocol: "GB28181",
        address: `3402000000132000000${newId}`,
        ip: `192.168.1.${120 + parseInt(newId)}:5060`,
        vendor: "宇视科技",
        streamMode: "UDP",
        channels: 4,
        status: "在线",
        statusType: "online",
        subscribe: { catalog: true, location: true, alarm: false },
        stats: { heartbeat: "6ms", register: "0.08s" }
      };
      mockDevices.unshift(newDev);
      filterData();
      triggerToast('新 GB28181 节点已添加接入');
    }

    function refreshData() {
      filterData();
      triggerToast('列表数据刷新成功');
    }

    // 初始渲染
    window.onload = function() {
      renderTable(mockDevices);
    };
  </script>
</body>
</html>
